<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Team Weekly Dashboard</title>
<style>
  :root {
    --navy: #18174c;
    --gold: #c9a44e;
    --lavender: #dedfed;
    --blue: #89acc9;
    --green: #2e7d52;
    --green-light: #eaf5ef;
    --amber: #b8860b;
    --amber-light: #fdf6e3;
    --red: #b23b3b;
    --red-light: #fdf0f0;
    --gray: #6b6b80;
    --bg: #f4f4f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--navy);
    padding: 24px 20px;
    min-height: 100vh;
  }
  .header {
    background: var(--navy);
    border-radius: 12px;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .header-left h1 {
    color: var(--gold);
    font-size: 1.25em;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .header-left .subtitle {
    color: var(--lavender);
    font-size: 0.78em;
    font-family: 'Arial', sans-serif;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .last-updated {
    color: var(--lavender);
    font-size: 0.75em;
    font-family: Arial, sans-serif;
  }
  .refresh-btn {
    background: var(--gold);
    color: var(--navy);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: Georgia, serif;
    font-size: 0.82em;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .refresh-btn:hover { opacity: 0.88; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }

  .rep-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(24,23,76,0.08);
    border: 1px solid rgba(24,23,76,0.07);
  }
  .card-header {
    background: var(--navy);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rep-name {
    color: var(--gold);
    font-size: 1.05em;
    letter-spacing: 0.3px;
  }
  .card-body { padding: 16px 18px; }

  /* KPI row */
  .kpi-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .kpi-box {
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .kpi-box.on-track { background: var(--green-light); border: 1px solid #b2dfc5; }
  .kpi-box.at-risk   { background: var(--amber-light); border: 1px solid #f0d98a; }
  .kpi-box.behind    { background: var(--red-light);   border: 1px solid #f0bcbc; }
  .kpi-box.no-data   { background: #f4f4f8; border: 1px solid #ddd; }

  .kpi-label {
    font-family: Arial, sans-serif;
    font-size: 0.65em;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--gray);
    margin-bottom: 4px;
  }
  .kpi-value {
    font-size: 1.4em;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 2px;
  }
  .kpi-box.on-track .kpi-value { color: var(--green); }
  .kpi-box.at-risk .kpi-value  { color: var(--amber); }
  .kpi-box.behind .kpi-value   { color: var(--red); }
  .kpi-box.no-data .kpi-value  { color: var(--gray); }

  .kpi-goal {
    font-family: Arial, sans-serif;
    font-size: 0.68em;
    color: var(--gray);
  }

  /* Touchpoints section */
  .section-label {
    font-family: Arial, sans-serif;
    font-size: 0.67em;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--gray);
    margin-bottom: 8px;
  }
  .touchpoints-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .tp-cell {
    background: var(--bg);
    border-radius: 6px;
    padding: 7px 6px;
    text-align: center;
  }
  .tp-cell-label {
    font-family: Arial, sans-serif;
    font-size: 0.62em;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .tp-cell-value {
    font-size: 1em;
    font-weight: bold;
    color: var(--navy);
  }

  /* Weekly total bar */
  .total-bar {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .total-bar-left {
    font-family: Arial, sans-serif;
    font-size: 0.72em;
    color: var(--gray);
  }
  .total-bar-right {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .total-number {
    font-size: 1.35em;
    font-weight: bold;
  }
  .total-goal {
    font-family: Arial, sans-serif;
    font-size: 0.72em;
    color: var(--gray);
  }
  .total-bar.met .total-number   { color: var(--green); }
  .total-bar.close .total-number { color: var(--amber); }
  .total-bar.behind .total-number{ color: var(--red); }

  /* Progress bar */
  .progress-wrap {
    margin-top: 6px;
    background: #e0e0ea;
    border-radius: 99px;
    height: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .met   .progress-fill { background: var(--green); }
  .close .progress-fill { background: var(--amber); }
  .behind .progress-fill{ background: var(--red); }

  /* Loading / error */
  .status-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray);
    font-family: Arial, sans-serif;
    font-size: 0.9em;
  }
  .divider {
    height: 1px;
    background: var(--lavender);
    margin: 14px 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Sales Team — Weekly Performance</h1>
    <div class="subtitle">MTF Meetings · Closes · Confirmed Clients · Touchpoints</div>
  </div>
  <div class="header-right">
    <div class="last-updated" id="lastUpdated">Loading...</div>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</div>

<div id="grid" class="grid">
  <div class="status-msg">Loading dashboard...</div>
</div>

<script>
const SHEET_ID  = '1ujwyY7WThRWJXlftxAaAFh41qNp9cGv3b8QjtkkDOu8';
const API_KEY   = 'AIzaSyCKnPHKRlDNyI74Ui223US7RhH7GxrG8bc';
const TEAM_REPS = ['Stephanie','Manny','Sebastian','Kevin','Luke','Brad','Latoya'];

const GOALS = { mtf: 32, closes: 8, clients: 4, touchpoints: 200 };

async function fetchRange(sheetName, range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheetName + '!' + range)}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sheet fetch failed: ${res.status}`);
  const data = await res.json();
  return data.values || [];
}

function parseTeamSummary(rows) {
  // Find header row, then parse rep rows
  const map = {};
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (row.some(c => /linkedin/i.test(c))) { headerIdx = i; break; }
  }
  if (headerIdx === -1) return map;
  const headers = rows[headerIdx].map(h => h.trim().toLowerCase());
  const liIdx    = headers.findIndex(h => /linkedin/i.test(h));
  const phoneIdx = headers.findIndex(h => /phone|cold/i.test(h));
  const eventIdx = headers.findIndex(h => /event|network/i.test(h));
  const dmIdx    = headers.findIndex(h => /dm|text/i.test(h));
  const emailIdx = headers.findIndex(h => /email/i.test(h));
  const otherIdx = headers.findIndex(h => /other/i.test(h));
  const totalIdx = headers.findIndex(h => /total/i.test(h));

  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = (row[0] || '').trim();
    if (!name || /total/i.test(name)) continue;
    map[name.toLowerCase()] = {
      linkedin : parseInt(row[liIdx]    || 0) || 0,
      phone    : parseInt(row[phoneIdx] || 0) || 0,
      events   : parseInt(row[eventIdx] || 0) || 0,
      dm       : parseInt(row[dmIdx]    || 0) || 0,
      email    : parseInt(row[emailIdx] || 0) || 0,
      other    : parseInt(row[otherIdx] || 0) || 0,
      total    : parseInt(row[totalIdx] || 0) || 0,
    };
  }
  return map;
}

function parseGHL(rows) {
  const map = {};
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].some(c => /associate/i.test(c))) { headerIdx = i; break; }
  }
  if (headerIdx === -1) return map;
  const headers = rows[headerIdx].map(h => h.trim().toLowerCase());
  const mtfIdx     = headers.findIndex(h => /meet.*founder|mtf/i.test(h));
  const closesIdx  = headers.findIndex(h => /game plan|close/i.test(h));
  const clientsIdx = headers.findIndex(h => /confirmed/i.test(h));

  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = (row[0] || '').trim();
    if (!name) continue;
    map[name.toLowerCase()] = {
      mtf     : parseInt(row[mtfIdx]     || 0) || 0,
      closes  : parseInt(row[closesIdx]  || 0) || 0,
      clients : parseInt(row[clientsIdx] || 0) || 0,
    };
  }
  return map;
}

function kpiStatus(val, goal) {
  const pct = goal > 0 ? val / goal : 0;
  if (pct >= 1)    return 'on-track';
  if (pct >= 0.7)  return 'at-risk';
  return 'behind';
}

function touchStatus(total) {
  if (total >= GOALS.touchpoints)         return 'met';
  if (total >= GOALS.touchpoints * 0.75)  return 'close';
  return 'behind';
}

function kpiBox(label, value, goal) {
  const status = kpiStatus(value, goal);
  const hasData = value > 0 || true; // always show
  return `
    <div class="kpi-box ${hasData ? status : 'no-data'}">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-goal">Goal: ${goal}</div>
    </div>`;
}

function repCard(name, summary, ghl) {
  const tp = summary || { linkedin:0, phone:0, events:0, dm:0, email:0, other:0, total:0 };
  const g  = ghl     || { mtf:0, closes:0, clients:0 };
  const ts = touchStatus(tp.total);
  const pct = Math.min(100, Math.round((tp.total / GOALS.touchpoints) * 100));

  return `
  <div class="rep-card">
    <div class="card-header">
      <div class="rep-name">${name}</div>
    </div>
    <div class="card-body">
      <div class="section-label">Pipeline KPIs</div>
      <div class="kpi-row">
        ${kpiBox('MTF Meetings', g.mtf, GOALS.mtf)}
        ${kpiBox('Closes', g.closes, GOALS.closes)}
        ${kpiBox('Confirmed Clients', g.clients, GOALS.clients)}
      </div>
      <div class="divider"></div>
      <div class="section-label">Weekly Touchpoints</div>
      <div class="touchpoints-grid">
        <div class="tp-cell"><div class="tp-cell-label">LinkedIn</div><div class="tp-cell-value">${tp.linkedin}</div></div>
        <div class="tp-cell"><div class="tp-cell-label">Phone</div><div class="tp-cell-value">${tp.phone}</div></div>
        <div class="tp-cell"><div class="tp-cell-label">Events</div><div class="tp-cell-value">${tp.events}</div></div>
        <div class="tp-cell"><div class="tp-cell-label">DM / Text</div><div class="tp-cell-value">${tp.dm}</div></div>
        <div class="tp-cell"><div class="tp-cell-label">Email</div><div class="tp-cell-value">${tp.email}</div></div>
        <div class="tp-cell"><div class="tp-cell-label">Other</div><div class="tp-cell-value">${tp.other}</div></div>
      </div>
      <div class="total-bar ${ts}">
        <div class="total-bar-left">
          Weekly Total
          <div class="progress-wrap">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="total-bar-right">
          <span class="total-number">${tp.total}</span>
          <span class="total-goal">/ ${GOALS.touchpoints}</span>
        </div>
      </div>
    </div>
  </div>`;
}

async function loadData() {
  const grid = document.getElementById('grid');
  const updEl = document.getElementById('lastUpdated');
  grid.innerHTML = '<div class="status-msg">Loading...</div>';

  try {
    const [summaryRows, ghlRows] = await Promise.all([
      fetchRange('Team Summary', 'A1:I50'),
      fetchRange('GHL Performance Data', 'A1:D30'),
    ]);

    const summaryMap = parseTeamSummary(summaryRows);
    const ghlMap     = parseGHL(ghlRows);

    const cards = TEAM_REPS.map(name => {
      const key = name.toLowerCase();
      return repCard(name, summaryMap[key], ghlMap[key]);
    }).join('');

    grid.innerHTML = cards || '<div class="status-msg">No data found. Check sheet sharing and tab names.</div>';
    updEl.textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch (err) {
    grid.innerHTML = `<div class="status-msg">Could not load data. Check that the sheet is shared and the API key is valid.<br><br><small>${err.message}</small></div>`;
    updEl.textContent = 'Load failed';
    console.error(err);
  }
}

loadData();
</script>
</body>
</html>
